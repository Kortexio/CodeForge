name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to attach / update artifacts for (e.g. v0.3.0).'
        required: true
        default: 'v0.3.0'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Code-OSS preinstall requires the same major as vscode/.nvmrc (currently 24.22+).
          node-version: '24.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Inno Setup
        run: winget install -e --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements

      - name: Setup Code-OSS
        run: npm run vscode:setup
        env:
          # Override via repo variable VSCODE_REF. Default in setup-vscode.mjs is the
          # last npm-era SHA — upstream main is pnpm-only and breaks this workflow.
          VSCODE_REF: ${{ vars.VSCODE_REF }}

      - name: Build extensions
        run: npm run build:extensions

      - name: Package Windows (portable + installer)
        run: npm run vscode:package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows
          path: |
            dist/codeforge-win32-x64/*.exe
            dist/codeforge-win32-x64/*.zip
            dist/codeforge-win32-x64/*.txt

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: codeforge-windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: artifacts/*
          draft: false
          # Preserve curated notes when updating an existing release (e.g. v0.3.0 re-run).
          generate_release_notes: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
