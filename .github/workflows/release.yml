name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Inno Setup
        run: winget install -e --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements

      - name: Setup Code-OSS
        run: npm run vscode:setup

      - name: Build extensions
        run: npm run build:extensions

      - name: Package Windows (portable + installer)
        run: npm run vscode:package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows
          path: |
            dist/codeforge-win32-x64/*.exe
            dist/codeforge-win32-x64/*.zip
            dist/codeforge-win32-x64/*.txt

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: codeforge-windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
